name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed release metadata and schemas
        run: |
          cd /tmp
          python - <<'PY'
          from importlib.metadata import files as distribution_files, metadata
          from importlib.resources import files
          from patch_verifier import __version__

          assert __version__ == "0.6.0"
          package_metadata = metadata("agent-patch-verifier")
          assert package_metadata["License-Expression"] == "Apache-2.0"
          assert any(
              str(path).endswith("licenses/LICENSE")
              for path in distribution_files("agent-patch-verifier") or ()
          )
          schemas = files("patch_verifier").joinpath("schemas")
          assert schemas.joinpath("evidence-plan.schema.json").is_file()
          assert schemas.joinpath("context.schema.json").is_file()
          assert schemas.joinpath("manifest.schema.json").is_file()
          assert schemas.joinpath("requirements-draft.schema.json").is_file()
          assert schemas.joinpath("requirement-review.schema.json").is_file()
          assert schemas.joinpath("reviewed-requirements.schema.json").is_file()
          assert schemas.joinpath("test-proposals.schema.json").is_file()
          assert schemas.joinpath("test-proposal-review.schema.json").is_file()
          assert schemas.joinpath("reviewed-test-proposals.schema.json").is_file()
          assert schemas.joinpath("test-materialization.schema.json").is_file()
          PY
          apv --version
          apv import-test-proposals --help
          apv prepare-test-review --help
          apv finalize-test-review --help
          apv materialize-reviewed-tests --help
          apv verify-materialized --help
